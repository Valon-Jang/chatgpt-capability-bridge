name: EXP-002 Persistent Naver Calendar Session

on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/session/exp002-start.json"

permissions:
  contents: write

jobs:
  persistent-session:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DISPLAY: ":99"
      CHROME_BIN: /usr/bin/google-chrome
      CB_COMMAND_PATH: experiments/session/exp002-command.json
      CB_RESULT_PATH: experiments/session/exp002-result.json
      CB_STATUS_PATH: experiments/session/exp002-status.json
      CB_ADAPTER_PATH: adapters/naver-calendar/adapter.py
      CB_SESSION_ADAPTER_PATH: adapters/naver-calendar/session_adapter.py
      CB_DEBUGGER_ADDRESS: 127.0.0.1:9222
      CB_POLL_SECONDS: "5"
      CB_SOFT_LIMIT_SECONDS: "20700"
      CB_AUTH_TIMEOUT_SECONDS: "20700"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require private VNC bootstrap secret
        shell: bash
        env:
          CB_VNC_PASSWORD: ${{ secrets.CB_VNC_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CB_VNC_PASSWORD:-}" ]; then
            echo "::error title=BOOTSTRAP_REQUIRED::Create repository secret CB_VNC_PASSWORD with a random VNC-only password. Do not reuse a Naver or other account password."
            exit 78
          fi
          echo "VNC bootstrap secret is configured; its value will not be printed."

      - name: Install persistent browser bridge dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb x11vnc novnc websockify
          python -m pip install --upgrade pip
          python -m pip install selenium
          google-chrome --version

      - name: Start protected persistent browser surface
        shell: bash
        env:
          CB_VNC_PASSWORD: ${{ secrets.CB_VNC_PASSWORD }}
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1280x900x24 -ac > /tmp/xvfb.log 2>&1 &
          sleep 2

          x11vnc -storepasswd "$CB_VNC_PASSWORD" /tmp/vnc.pass >/dev/null
          x11vnc -display :99 -rfbauth /tmp/vnc.pass -forever -shared -rfbport 5900 > /tmp/x11vnc.log 2>&1 &
          websockify --web=/usr/share/novnc/ 6080 localhost:5900 > /tmp/novnc.log 2>&1 &

          curl -L --fail --silent --show-error \
            -o /tmp/cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i /tmp/cloudflared.deb >/dev/null
          cloudflared tunnel --no-autoupdate --url http://127.0.0.1:6080 > /tmp/cloudflared.log 2>&1 &

          URL=""
          for _ in $(seq 1 45); do
            URL="$(grep -oE 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n 1 || true)"
            [ -n "$URL" ] && break
            sleep 1
          done
          if [ -z "$URL" ]; then
            echo "Could not obtain interactive browser tunnel URL."
            exit 1
          fi

          google-chrome \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-gpu \
            --window-size=1280,900 \
            --lang=ko-KR \
            --user-data-dir=/tmp/cb-exp002-persistent-profile \
            --remote-debugging-address=127.0.0.1 \
            --remote-debugging-port=9222 \
            --no-first-run \
            --no-default-browser-check \
            https://m.calendar.naver.com/ > /tmp/chrome.log 2>&1 &

          for _ in $(seq 1 45); do
            curl --silent --fail http://127.0.0.1:9222/json/version >/dev/null && break
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:9222/json/version >/dev/null

          echo "INTERACTIVE_BROWSER_URL=$URL/vnc.html?autoconnect=1&resize=scale" >> "$GITHUB_ENV"
          echo "::notice title=Persistent browser ready::Open $URL/vnc.html?autoconnect=1&resize=scale. Enter the repository secret CB_VNC_PASSWORD. Authenticate Naver once; the same browser stays alive across adapter retries and new commands."
          echo "Interactive browser: $URL/vnc.html?autoconnect=1&resize=scale"
          echo "VNC password is the repository secret CB_VNC_PASSWORD and is intentionally not logged."

      - name: Keep authenticated browser alive and consume commands
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/persistent_session_worker.py
