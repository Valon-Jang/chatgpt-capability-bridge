name: EXP-002 Persistent Naver Calendar Session

on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/session/exp002-start.json"

permissions:
  contents: write

jobs:
  persistent-session:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DISPLAY: ":99"
      CHROME_BIN: /usr/bin/google-chrome
      CB_COMMAND_PATH: experiments/session/exp002-command.json
      CB_RESULT_PATH: experiments/session/exp002-result.json
      CB_STATUS_PATH: experiments/session/exp002-status.json
      CB_ADAPTER_PATH: adapters/naver-calendar/adapter.py
      CB_SESSION_ADAPTER_PATH: adapters/naver-calendar/session_adapter.py
      CB_DEBUGGER_ADDRESS: 127.0.0.1:9222
      CB_POLL_SECONDS: "5"
      CB_SOFT_LIMIT_SECONDS: "20700"
      CB_AUTH_TIMEOUT_SECONDS: "20700"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install persistent browser dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb
          python -m pip install --upgrade pip
          python -m pip install selenium
          google-chrome --version

      - name: Start persistent Chrome
        shell: bash
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1280x900x24 -ac > /tmp/xvfb.log 2>&1 &
          sleep 2

          google-chrome \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-gpu \
            --window-size=1280,900 \
            --lang=ko-KR \
            --user-data-dir=/tmp/cb-exp002-persistent-profile \
            --remote-debugging-address=127.0.0.1 \
            --remote-debugging-port=9222 \
            --no-first-run \
            --no-default-browser-check \
            about:blank > /tmp/chrome.log 2>&1 &

          for _ in $(seq 1 45); do
            curl --silent --fail http://127.0.0.1:9222/json/version >/dev/null && break
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:9222/json/version >/dev/null
          echo "Persistent Chrome is ready; it will remain alive across adapter retries."

      - name: Prepare Naver QR authentication handoff
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/exp002-auth
          python scripts/naver_qr_bootstrap.py \
            --debugger-address 127.0.0.1:9222 \
            --output artifacts/exp002-auth/naver-qr-login.png
          echo "::notice title=QR authentication ready::Download the exp002-naver-qr-auth artifact and scan the QR with the Naver app. The same Chrome will remain alive after authentication and across adapter retries."

      - name: Publish QR authentication image
        uses: actions/upload-artifact@v4
        with:
          name: exp002-naver-qr-auth-${{ github.run_id }}
          path: artifacts/exp002-auth/naver-qr-login.png
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Keep authenticated browser alive and consume commands
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/persistent_session_worker.py
