name: AI Community Hub Persistent Browser

on:
  push:
    paths:
      - "experiments/community/session/start.json"

concurrency:
  group: ai-community-hub-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DISPLAY: ":99"
      CB_COMMAND_PATH: experiments/community/session/command.json
      CB_RESULT_PATH: experiments/community/session/result.json
      CB_STATUS_PATH: experiments/community/session/status.json
      CB_ADAPTER_PATH: adapters/community/adapter.py
      CB_SESSION_ADAPTER_PATH: adapters/community/session_adapter.py
      CB_DEBUGGER_ADDRESS: 127.0.0.1:9222
      CB_POLL_SECONDS: "5"
      CB_SOFT_LIMIT_SECONDS: "20700"
      CB_AUTH_TIMEOUT_SECONDS: "900"
      DEBIAN_FRONTEND: noninteractive

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser handoff dependencies
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s sudo apt-get -o Acquire::Retries=3 update
          timeout 120s sudo apt-get install -y --no-install-recommends xvfb x11vnc novnc websockify curl jq
          python -m pip install --disable-pip-version-check --no-input selenium cryptography
          curl -L --fail --retry 3 --connect-timeout 15 --max-time 90 -o /tmp/cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i /tmp/cloudflared.deb
      - name: Start retained multi-community Chrome and temporary VNC
        id: browser
        shell: bash
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1365x900x24 -ac >/tmp/xvfb.log 2>&1 &
          sleep 2
          google-chrome --no-sandbox --disable-dev-shm-usage --disable-gpu --window-size=1365,900 --lang=en-US --user-data-dir=/tmp/cb-community-profile --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 --no-first-run --no-default-browser-check https://www.reddit.com/r/LocalLLaMA/ https://news.hada.io/ https://news.ycombinator.com/ >/tmp/chrome.log 2>&1 &
          for _ in $(seq 1 45); do curl -sf http://127.0.0.1:9222/json/version >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:9222/json/version >/dev/null
          VNC_PASSWORD="$(openssl rand -hex 6)"
          x11vnc -storepasswd "$VNC_PASSWORD" /tmp/community-vnc.pass >/dev/null
          x11vnc -display :99 -rfbauth /tmp/community-vnc.pass -forever -shared -rfbport 5900 >/tmp/x11vnc.log 2>&1 &
          websockify --web=/usr/share/novnc/ 6080 localhost:5900 >/tmp/websockify.log 2>&1 &
          cloudflared tunnel --no-autoupdate --url http://127.0.0.1:6080 >/tmp/cloudflared.log 2>&1 &
          TUNNEL_URL=""
          for _ in $(seq 1 60); do TUNNEL_URL="$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n1 || true)"; [ -n "$TUNNEL_URL" ] && break; sleep 1; done
          test -n "$TUNNEL_URL"
          echo "vnc_password=$VNC_PASSWORD" >> "$GITHUB_OUTPUT"
          echo "tunnel_url=$TUNNEL_URL" >> "$GITHUB_OUTPUT"
      - name: Publish encrypted login handoff
        shell: bash
        env:
          VNC_PASSWORD: ${{ steps.browser.outputs.vnc_password }}
          TUNNEL_URL: ${{ steps.browser.outputs.tunnel_url }}
        run: |
          set -euo pipefail
          python scripts/community_auth_handoff.py --start experiments/community/session/start.json --url "$TUNNEL_URL" --vnc-password "$VNC_PASSWORD" --output experiments/community/session/auth-handoff.enc.b64
          git config user.name "capability-bridge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add experiments/community/session/auth-handoff.enc.b64
          git commit -m "Publish encrypted AI community login handoff [skip ci]" || true
          git pull --rebase origin main
          git push
      - name: Consume user-approved community commands
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/persistent_session_worker.py
