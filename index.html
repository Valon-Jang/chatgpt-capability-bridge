<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173d76">
<title>신규 패키징 기술 Naming 공모</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#17202a;--muted:#6b7580;--line:#dfe5ea;--blue:#2563eb;--green:#14814b;--red:#b83232;--amber:#986000}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Malgun Gothic",sans-serif}.wrap{max-width:760px;margin:auto;padding:12px 12px 70px}.hero{background:linear-gradient(135deg,#173d76,#245ca8);color:#fff;border-radius:20px;padding:22px 18px;box-shadow:0 8px 28px rgba(20,40,70,.1)}.eyebrow{font-size:11px;font-weight:800;opacity:.78;letter-spacing:.07em}h1{font-size:27px;line-height:1.18;margin:7px 0 11px}.desc{font-size:14px;line-height:1.65;opacity:.95}.pills{display:flex;gap:7px;flex-wrap:wrap;margin-top:15px}.pill{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);padding:7px 10px;border-radius:999px;font-size:12px;font-weight:750}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:17px;margin-top:12px;box-shadow:0 7px 22px rgba(20,35,55,.055)}.card h2{font-size:19px;margin:0 0 7px}.muted{color:var(--muted);font-size:13px;line-height:1.55}.big{font-size:38px;font-weight:900;letter-spacing:-.04em}.big small{font-size:14px;color:var(--muted);font-weight:700}input{width:100%;border:1px solid #cbd4dc;border-radius:12px;padding:13px 14px;font-size:16px;outline:none;background:#fff}input:focus{border-color:#7da7fa;box-shadow:0 0 0 3px rgba(37,99,235,.1)}button{border:0;border-radius:12px;padding:12px 15px;font-size:14px;font-weight:800;cursor:pointer}button:disabled{opacity:.45}.primary{background:var(--blue);color:#fff}.secondary,.mini{background:#edf1f5;color:#26323c}.mini{padding:8px 10px;font-size:12px}.form{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:11px}@media(max-width:520px){.form{grid-template-columns:1fr}.form button{width:100%}}.notice{border-radius:13px;padding:11px 13px;font-size:13px;line-height:1.55;margin-top:10px}.info{background:#eef5ff;border:1px solid #d5e4ff;color:#254e87}.ok{background:#edf9f3;border:1px solid #ccebd9;color:#11653c}.warn{background:#fff8e8;border:1px solid #ffe1a3;color:#754b05}.bad{background:#fff0f0;border:1px solid #ffd2d2;color:#8b2727}.list{display:grid;gap:8px;margin-top:10px}.item{border:1px solid var(--line);border-radius:13px;padding:13px;background:#fff}.name{font-size:16px;font-weight:800;word-break:break-word}.vote{display:flex;gap:11px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;background:#fff}.vote.sel{background:#f3f7ff;border-color:#7ca7fa}.check{width:24px;height:24px;flex:0 0 24px;display:grid;place-items:center;border:2px solid #bbc4cd;border-radius:7px;color:#fff;font-weight:900}.vote.sel .check{background:var(--blue);border-color:var(--blue)}.sticky{position:sticky;bottom:10px;display:flex;justify-content:space-between;gap:10px;align-items:center;background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:15px;padding:11px;margin-top:12px;box-shadow:0 8px 24px rgba(0,0,0,.13)}.top3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}@media(max-width:600px){.top3{grid-template-columns:1fr}}.pod{border:1px solid var(--line);border-radius:14px;padding:14px}.rank{font-size:12px;font-weight:900;color:var(--blue)}.podName{font-size:18px;font-weight:900;margin:5px 0}.votes{font-size:28px;font-weight:900}.votes small{font-size:13px;color:var(--muted)}.resultRow{border-top:1px solid var(--line);padding:13px 0}.resultRow:first-child{border-top:0}.resultTop{display:grid;grid-template-columns:62px 1fr 58px;gap:6px;align-items:center}.rRank{font-weight:900;color:#334155}.rVotes{text-align:right;font-weight:900}.people{margin:7px 0 0 62px;font-size:12px;line-height:1.65;color:var(--muted)}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px}.loader{padding:40px 10px;text-align:center;color:var(--muted);font-size:14px}.spinner{width:28px;height:28px;border:3px solid #dce4ec;border-top-color:var(--blue);border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,15px);opacity:0;transition:.2s;z-index:99;max-width:90vw;padding:11px 15px;border-radius:11px;background:#111827;color:white;font-size:13px;font-weight:800;text-align:center;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="eyebrow">NAMING EVENT</div>
    <h1 id="title">신규 패키징 기술 Naming 공모</h1>
    <div class="desc" id="description">셀 유닛을 패키징에 넣으면 자중에 의해 장치가 가동되며, 셀을 잡아주는 기술</div>
    <div class="pills"><div class="pill" id="stage">상태 확인 중</div><div class="pill" id="clock">한국시간 기준</div></div>
  </div>
  <div id="app"><div class="loader"><div class="spinner"></div>공모 정보를 불러오는 중...</div></div>
</div>
<iframe name="namingApiFrame" id="namingApiFrame" class="hidden"></iframe>
<form id="namingApiForm" method="post" target="namingApiFrame" class="hidden"></form>
<div class="toast" id="toast"></div>
<script>
const API='https://script.google.com/macros/s/AKfycbzZ-U7fsdedBCepjgMAyCtgnuAKVAl4luVAH5MTJiqGUMYIoAXHOK0bqG-25dXsWxgZ/exec';
let state=null,currentName='',selectedVotes=new Set(),pendingWrite=null,jsonpSeq=0;
try{currentName=localStorage.getItem('namingParticipantName')||''}catch(e){}
window.addEventListener('load',()=>{loadState();setInterval(()=>{if(state&&state.stage!=='voting')loadState(false)},30000)});
window.addEventListener('message',ev=>{const d=ev.data;if(!d||d.source!=='naming-api'||!pendingWrite||d.requestId!==pendingWrite.requestId)return;const p=pendingWrite;pendingWrite=null;clearTimeout(p.timer);if(!d.response||!d.response.ok){toast(d.response&&d.response.message?d.response.message:'처리에 실패했습니다.');setBusy(p.button,false,p.label);return}toast(d.response.message||'완료되었습니다.');if(p.kind==='proposal'){const el=document.getElementById('candidateInput');if(el)el.value=''}setBusy(p.button,false,p.label);loadState(false)});
function jsonp(params){return new Promise((resolve,reject)=>{const cb='__namingCb_'+Date.now()+'_'+(++jsonpSeq);const s=document.createElement('script');const timer=setTimeout(()=>done(new Error('서버 응답 시간이 초과되었습니다.')),12000);function done(err,data){clearTimeout(timer);try{delete window[cb]}catch(e){};s.remove();err?reject(err):resolve(data)}window[cb]=data=>done(null,data);params.prefix=cb;params._=Date.now();s.src=API+'?'+new URLSearchParams(params).toString();s.onerror=()=>done(new Error('서버에 연결할 수 없습니다.'));document.body.appendChild(s)})}
async function loadState(show=true){if(show)showLoading();try{const data=await jsonp({action:'state',name:currentName});receiveState(data)}catch(e){toast(e.message||String(e));if(show)document.getElementById('app').innerHTML='<div class="card"><div class="notice bad">서버 연결에 실패했습니다. 잠시 후 다시 시도해 주세요.</div></div>'}}
function receiveState(data){if(!data||!data.ok){toast(data&&data.message?data.message:'정보를 불러오지 못했습니다.');return}state=data;if(state.participant){currentName=state.participant.name;try{localStorage.setItem('namingParticipantName',currentName)}catch(e){}}selectedVotes=new Set(state.myVotes||[]);render()}
function render(){if(!state)return;const cfg=state.config||{};document.getElementById('title').textContent=cfg.title||'신규 패키징 기술 Naming 공모';document.getElementById('description').textContent=cfg.description||'';document.getElementById('stage').textContent=stageLabel(state.stage);if(!state.participant)return renderLogin();if(state.stage==='proposal')return renderProposal();if(state.stage==='waiting')return renderWaiting();if(state.stage==='voting')return renderVoting();renderResults()}
function renderLogin(){document.getElementById('app').innerHTML=`<div class="card"><h2>참여자 이름</h2><div class="muted">이름만 입력하면 바로 참여할 수 있습니다. PC와 휴대폰에서도 같은 이름을 사용하면 같은 참여자로 처리됩니다.</div><div class="form"><input id="nameInput" maxlength="40" placeholder="이름 입력" autocomplete="name"><button class="primary" onclick="enterName()">시작</button></div></div>`;setTimeout(()=>document.getElementById('nameInput')?.focus(),100)}
function enterName(){const name=clean(document.getElementById('nameInput')?.value);if(!name)return toast('이름을 입력해 주세요.');currentName=name;try{localStorage.setItem('namingParticipantName',name)}catch(e){}loadState()}
function changeName(){if(!confirm('참여자 이름을 다시 입력하시겠습니까?'))return;currentName='';try{localStorage.removeItem('namingParticipantName')}catch(e){}state=null;loadState()}
function renderProposal(){const mine=state.myProposals||[];document.getElementById('app').innerHTML=`${userBar()}<div class="card"><div class="muted">현재 등록된 전체 후보</div><div class="big">${state.totalCount}<small>건</small></div><div class="notice info">제안 기간에는 <b>다른 사람이 제안한 이름과 제안자 정보가 공개되지 않습니다.</b></div></div><div class="card"><h2>새 이름 제안</h2><div class="muted">여러 개 제안할 수 있습니다. 동일한 이름은 중복 등록할 수 없습니다.</div><div class="form"><input id="candidateInput" maxlength="80" placeholder="새 이름 입력"><button id="proposalBtn" class="primary" onclick="submitProposal()">이름 등록</button></div></div><div class="card"><h2>내가 제안한 이름</h2>${mine.length?`<div class="list">${mine.map(x=>`<div class="item"><div class="name">${esc(x.name)}</div></div>`).join('')}</div>`:`<div class="muted">아직 제안한 이름이 없습니다.</div>`}</div>`}
function submitProposal(){const candidate=clean(document.getElementById('candidateInput')?.value);if(!candidate)return toast('제안할 이름을 입력해 주세요.');const btn=document.getElementById('proposalBtn');setBusy(btn,true,'등록 중...');postWrite('proposal',{name:currentName,candidate},btn,'이름 등록')}
function renderWaiting(){const c=state.candidates||[];document.getElementById('app').innerHTML=`${userBar()}<div class="card"><h2>이름 제안이 마감되었습니다.</h2><div class="notice warn">투표는 <b>9월 10일 오전 9시</b>부터 시작됩니다.</div><div class="big">${state.totalCount}<small>개 후보</small></div></div><div class="card"><h2>최종 후보</h2>${c.length?`<div class="list">${c.map(x=>`<div class="item"><div class="name">${esc(x.name)}</div></div>`).join('')}</div>`:`<div class="muted">등록된 후보가 없습니다.</div>`}</div>`}
function renderVoting(){const c=state.candidates||[];document.getElementById('app').innerHTML=`${userBar()}<div class="card"><h2>마음에 드는 이름을 선택해 주세요.</h2><div class="muted">최대 ${state.config.maxVotes}개까지 선택 가능합니다. 투표 마감 전에는 언제든 변경할 수 있습니다.</div><div class="notice info">투표 중에는 <b>제안자, 투표자, 득표수가 공개되지 않습니다.</b></div><div class="list">${c.map(x=>`<div class="vote ${selectedVotes.has(x.id)?'sel':''}" data-id="${attr(x.id)}" onclick="toggleVote('${js(x.id)}')"><div class="check">${selectedVotes.has(x.id)?'✓':''}</div><div class="name">${esc(x.name)}</div></div>`).join('')}</div><div class="sticky"><div><b id="selectedCount">${selectedVotes.size}</b> / ${state.config.maxVotes} 선택</div><button id="voteSaveBtn" class="primary" onclick="saveVote()">투표 저장</button></div></div>`}
function toggleVote(id){if(selectedVotes.has(id))selectedVotes.delete(id);else{const max=Number(state.config.maxVotes||3);if(selectedVotes.size>=max)return toast(`최대 ${max}개까지 투표할 수 있습니다.`);selectedVotes.add(id)}document.querySelectorAll('.vote').forEach(el=>{const iid=el.getAttribute('data-id'),sel=selectedVotes.has(iid);el.classList.toggle('sel',sel);const ck=el.querySelector('.check');if(ck)ck.textContent=sel?'✓':''});const ct=document.getElementById('selectedCount');if(ct)ct.textContent=selectedVotes.size}
function saveVote(){const btn=document.getElementById('voteSaveBtn');setBusy(btn,true,'저장 중...');postWrite('vote',{name:currentName,candidateIds:JSON.stringify(Array.from(selectedVotes))},btn,'투표 저장')}
function renderResults(){const rows=state.results||[],top3=rows.filter(x=>x.rank<=3);document.getElementById('app').innerHTML=`${userBar()}<div class="card"><h2>최종 결과</h2><div class="notice ok">투표가 마감되었습니다. 동점 후보는 공동 순위로 표시합니다.</div>${rows.length?`<div class="top3">${top3.map(x=>`<div class="pod"><div class="rank">${joint(rows,x.rank)?'공동 ':''}${x.rank}위</div><div class="podName">${esc(x.name)}</div><div class="votes">${x.count}<small>표</small></div><div class="muted">제안자 · ${esc(x.proposer)}</div></div>`).join('')}</div>`:`<div class="muted">결과가 없습니다.</div>`}</div>${rows.length?`<div class="card"><h2>전체 순위</h2>${rows.map(x=>`<div class="resultRow"><div class="resultTop"><div class="rRank">${joint(rows,x.rank)?'공동 ':''}${x.rank}위</div><div class="name">${esc(x.name)}</div><div class="rVotes">${x.count}표</div></div><div class="people"><b>제안자:</b> ${esc(x.proposer)}<br><b>투표자:</b> ${x.voters&&x.voters.length?x.voters.map(esc).join(', '):'없음'}</div></div>`).join('')}</div>`:''}`}
function postWrite(action,fields,button,label){if(pendingWrite)return toast('이전 요청을 처리 중입니다.');const requestId='r_'+Date.now()+'_'+Math.random().toString(36).slice(2),form=document.getElementById('namingApiForm');form.innerHTML='';form.action=API;const all={action,requestId,...fields};Object.entries(all).forEach(([k,v])=>{const i=document.createElement('input');i.type='hidden';i.name=k;i.value=String(v);form.appendChild(i)});const timer=setTimeout(()=>{if(pendingWrite&&pendingWrite.requestId===requestId){pendingWrite=null;setBusy(button,false,label);toast('서버 응답 시간이 초과되었습니다.')}} ,15000);pendingWrite={requestId,button,label,kind:action,timer};form.submit()}
function userBar(){return `<div class="card"><div class="toolbar"><div><div class="muted">참여자</div><div class="name">${esc(currentName)}</div></div><div><button class="mini" onclick="loadState()">새로고침</button> <button class="mini" onclick="changeName()">이름 변경</button></div></div></div>`}
function stageLabel(s){return s==='proposal'?'이름 제안 진행 중':s==='waiting'?'제안 마감 · 투표 대기':s==='voting'?'투표 진행 중':'투표 종료 · 최종 결과'}
function showLoading(){document.getElementById('app').innerHTML='<div class="loader"><div class="spinner"></div>정보를 불러오는 중...</div>'}
function setBusy(b,busy,label){if(!b)return;b.disabled=busy;b.textContent=label}
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.classList.remove('show'),2400)}
function joint(rows,r){return rows.filter(x=>x.rank===r).length>1}function clean(v){return String(v||'').trim().replace(/\s+/g,' ')}function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}function attr(v){return esc(v)}function js(v){return String(v??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
</script>
</body>
</html>
